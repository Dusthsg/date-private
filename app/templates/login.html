<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateLimit — Acesso ao Sistema</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        };
    </script>
    <script>
        (function() {
            try {
                const saved = localStorage.getItem('datelimit_theme');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (saved === 'dark' || (!saved && prefersDark)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex items-center justify-center p-4 transition-colors">

    <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
        
        <!-- Header do Card -->
        <div class="bg-gradient-to-r from-emerald-600 to-indigo-700 p-6 text-white text-center">
            <div class="w-12 h-12 bg-white/10 rounded-2xl mx-auto flex items-center justify-center mb-3 backdrop-blur-xs">
                <i data-lucide="shield-check" class="w-7 h-7 text-white"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tight">DateLimit</h1>
            <p class="text-xs text-emerald-100 mt-1">Controle de Validade & Auditoria Segura</p>
        </div>

        <!-- Conteúdo do Formulário -->
        <div class="p-6">
            
            {% if error %}
            <div class="mb-4 p-3 rounded-xl bg-rose-50 dark:bg-rose-950/60 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-xs flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 text-rose-500"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- Seletor de Modo: Senha vs PIN -->
            <div class="flex rounded-xl bg-gray-100 dark:bg-gray-700/60 p-1 mb-5">
                <button type="button" id="tab-btn-password" onclick="switchLoginTab('password')"
                        class="flex-1 py-1.5 text-xs font-semibold rounded-lg transition bg-white dark:bg-gray-800 text-gray-900 dark:text-white shadow-xs">
                    Usuário & Senha
                </button>
                <button type="button" id="tab-btn-pin" onclick="switchLoginTab('pin')"
                        class="flex-1 py-1.5 text-xs font-semibold rounded-lg transition text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white">
                    Acesso Rápido (PIN)
                </button>
            </div>

            <!-- Formulário 1: Usuário e Senha -->
            <form id="form-login-password" method="POST" action="/login" class="space-y-4">
                <input type="hidden" name="login_type" value="password">
                
                <div>
                    <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Usuário</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </span>
                        <input type="text" name="username" required autocomplete="username" autofocus
                               placeholder="Ex: admin"
                               class="w-full pl-9 pr-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-xl dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Senha</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </span>
                        <input type="password" name="password" required autocomplete="current-password"
                               placeholder="••••••••"
                               class="w-full pl-9 pr-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-xl dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <button type="submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-98 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-md flex items-center justify-center gap-2 cursor-pointer mt-2">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    <span>Entrar no Sistema</span>
                </button>
            </form>

            <!-- Formulário 2: PIN Rápido (Chão de Loja) -->
            <form id="form-login-pin" method="POST" action="/login" class="space-y-4 hidden">
                <input type="hidden" name="login_type" value="pin">

                <div>
                    <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Código PIN do Operador</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i data-lucide="key-round" class="w-4 h-4"></i>
                        </span>
                        <input type="password" id="input-pin" name="pin" maxlength="8" pattern="[0-9]*" inputmode="numeric"
                               placeholder="Digite seu PIN (ex: 1234)"
                               class="w-full pl-9 pr-3 py-2 text-sm text-center tracking-widest font-mono text-lg border border-gray-300 dark:border-gray-600 rounded-xl dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <p class="text-[11px] text-gray-500 dark:text-gray-400 mt-1 text-center">
                        Identificação individual instantânea para agilizar o chão de loja.
                    </p>
                </div>

                <button type="submit"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-98 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-md flex items-center justify-center gap-2 cursor-pointer mt-2">
                    <i data-lucide="zap" class="w-4 h-4"></i>
                    <span>Acessar com PIN</span>
                </button>
            </form>

            <!-- Dica Inicial -->
            <div class="mt-6 pt-4 border-t border-gray-100 dark:border-gray-700/80 text-center">
                <span class="text-[11px] text-gray-500 dark:text-gray-400">
                    Primeiro acesso? Use <code class="font-mono bg-gray-100 dark:bg-gray-700 px-1.5 py-0.5 rounded text-gray-800 dark:text-gray-200">admin</code> / <code class="font-mono bg-gray-100 dark:bg-gray-700 px-1.5 py-0.5 rounded text-gray-800 dark:text-gray-200">admin123</code> (PIN: <code class="font-mono bg-gray-100 dark:bg-gray-700 px-1.5 py-0.5 rounded text-gray-800 dark:text-gray-200">1234</code>)
                </span>
            </div>

        </div>

    </div>

    <script>
        function switchLoginTab(mode) {
            const btnPwd = document.getElementById('tab-btn-password');
            const btnPin = document.getElementById('tab-btn-pin');
            const formPwd = document.getElementById('form-login-password');
            const formPin = document.getElementById('form-login-pin');

            if (mode === 'password') {
                btnPwd.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg transition bg-white dark:bg-gray-800 text-gray-900 dark:text-white shadow-xs";
                btnPin.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg transition text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white";
                formPwd.classList.remove('hidden');
                formPin.classList.add('hidden');
            } else {
                btnPin.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg transition bg-white dark:bg-gray-800 text-gray-900 dark:text-white shadow-xs";
                btnPwd.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg transition text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white";
                formPin.classList.remove('hidden');
                formPwd.classList.add('hidden');
                const pinInput = document.getElementById('input-pin');
                if (pinInput) pinInput.focus();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) window.lucide.createIcons();
        });
    </script>
</body>
</html>
