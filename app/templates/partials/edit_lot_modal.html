<!-- Modal de Edição Completa de Lote (Com Data de Validade Fixa) -->
<div id="modal-edit-lot"
     onclick="if(event.target === this) closeEditLotModal()"
     class="hidden fixed inset-0 z-50 items-center justify-center p-3 bg-black/60 backdrop-blur-xs transition-opacity duration-200">

    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 w-full max-w-lg max-h-[92vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-150">

        <!-- Cabeçalho do Modal -->
        <div class="px-5 py-4 border-b border-gray-100 dark:border-gray-700/80 flex items-center justify-between bg-gray-50/70 dark:bg-gray-800/80">
            <div class="flex items-center gap-2.5">
                <div class="p-2 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400">
                    <i data-lucide="edit-3" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 class="text-sm sm:text-base font-bold text-gray-900 dark:text-white">
                        Editar Lote <span id="edit-modal-lot-id-title" class="text-indigo-600 dark:text-indigo-400 font-mono"></span>
                    </h3>
                    <p class="text-[11px] text-gray-500 dark:text-gray-400">Atualize os campos operacionais do lote (validade mantida fixa).</p>
                </div>
            </div>
            <button type="button"
                    onclick="closeEditLotModal()"
                    class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition cursor-pointer">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Formulário de Edição -->
        <form id="form-edit-lot"
              hx-on::after-request="onEditLotModalAfterRequest(event)"
              class="p-5 overflow-y-auto space-y-4 text-xs sm:text-sm">

            <input type="hidden" id="edit-modal-lot-id" name="lot_id" value="">

            <!-- Nome do Produto -->
            <div>
                <label class="block font-semibold text-gray-700 dark:text-gray-200 mb-1">Nome do Produto *</label>
                <input type="text"
                       id="edit-modal-name"
                       name="name"
                       required
                       class="w-full border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 uppercase text-gray-800 dark:text-white dark:bg-gray-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <!-- Grid de Quantidade e Preço -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <div>
                    <label class="block font-semibold text-gray-700 dark:text-gray-200 mb-1">Quantidade *</label>
                    <input type="number"
                           id="edit-modal-quant"
                           name="quant"
                           min="0"
                           required
                           class="w-full border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 text-gray-800 dark:text-white dark:bg-gray-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block font-semibold text-gray-700 dark:text-gray-200 mb-1">Preço (R$) *</label>
                    <input type="number"
                           step="0.01"
                           id="edit-modal-price"
                           name="price"
                           min="0"
                           required
                           class="w-full border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 text-gray-800 dark:text-white dark:bg-gray-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>

            <!-- Data de Validade (Estritamente FIXA) -->
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="block font-semibold text-gray-700 dark:text-gray-200">Data de Validade (Fixa)</label>
                    <span class="inline-flex items-center gap-1 text-[11px] font-bold text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/70 px-2 py-0.5 rounded-full border border-amber-200 dark:border-amber-800">
                        <i data-lucide="lock" class="w-3 h-3"></i> Imutável
                    </span>
                </div>
                <div class="relative">
                    <input type="date"
                           id="edit-modal-date"
                           disabled
                           readonly
                           class="w-full border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-gray-900/60 cursor-not-allowed select-none opacity-80">
                </div>
                <p class="text-[11px] text-gray-400 dark:text-gray-500 mt-1 flex items-center gap-1">
                    <i data-lucide="info" class="w-3 h-3 text-gray-400"></i> Por segurança operacional, a data de validade deste lote é fixa e não pode ser modificada.
                </p>
            </div>

            <!-- Grid de Localização e Status -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <div>
                    <label class="block font-semibold text-gray-700 dark:text-gray-200 mb-1">Localização *</label>
                    <select id="edit-modal-location"
                            name="location"
                            required
                            class="w-full border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 text-gray-800 dark:text-white dark:bg-gray-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="LOJA">LOJA</option>
                        <option value="GALPÃO">GALPÃO</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold text-gray-700 dark:text-gray-200 mb-1">Status Operacional *</label>
                    <select id="edit-modal-status"
                            name="status"
                            required
                            class="w-full border border-gray-300 dark:border-gray-600 rounded-xl px-3 py-2 text-gray-800 dark:text-white dark:bg-gray-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="NORMAL">NORMAL</option>
                        <option value="QUEIMA-DE-ESTOQUE">QUEIMA-DE-ESTOQUE</option>
                        <option value="PROMOCIONAL">PROMOCIONAL</option>
                    </select>
                </div>
            </div>

            <!-- Mensagem de Feedback -->
            <div id="edit-modal-msg" class="hidden"></div>

            <!-- Ações do Modal -->
            <div class="pt-3 border-t border-gray-100 dark:border-gray-700 flex items-center justify-end gap-2.5">
                <button type="button"
                        onclick="closeEditLotModal()"
                        class="px-4 py-2 text-xs font-semibold rounded-xl border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 transition cursor-pointer">
                    Cancelar
                </button>
                <button type="submit"
                        id="btn-save-edit-lot"
                        class="px-4 py-2 text-xs font-bold rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white transition shadow-sm cursor-pointer flex items-center gap-1.5">
                    <i data-lucide="check" class="w-4 h-4"></i>
                    <span>Salvar Alterações</span>
                </button>
            </div>
        </form>
    </div>
</div>
