{# Partial: chunk subsequente de lotes carregados via rolagem infinita #}
{% for lot in lots %}
    {% include "partials/lot_row_item.html" %}
{% endfor %}

{% if has_more %}
<tr id="infinite-scroll-trigger"
    hx-get="/lots/page?filtro={{ filtro }}&busca={{ busca }}&page={{ next_page }}"
    hx-trigger="intersect once rootMargin:600px, revealed"
    hx-swap="outerHTML"
    class="bg-gray-50/50 hover:bg-gray-100 transition">
    <td colspan="8" class="py-3 text-center text-gray-500 text-xs">
        <div class="inline-flex items-center gap-2 font-medium">
            <svg class="animate-spin h-4 w-4 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
            <span>Carregando mais lotes...</span>
        </div>
    </td>
</tr>
{% else %}
{% if total > 0 %}
<tr id="limit-note">
    <td colspan="8" class="px-4 py-3 text-center text-xs text-gray-400 bg-gray-50 italic border-t">
        ✓ Todos os {{ total }} lotes foram carregados.
    </td>
</tr>
{% endif %}
{% endif %}
