<!-- Modal de Edição de Perfil do Usuário -->
<div id="profile-modal"
     class="hidden fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto"
     aria-labelledby="profile-modal-title"
     role="dialog"
     aria-modal="true">
    
    <!-- Fundo escurecido -->
    <div onclick="closeProfileModal()"
         class="fixed inset-0 bg-black/60 backdrop-blur-xs transition-opacity duration-200"></div>

    <!-- Card do Modal -->
    <div class="relative w-full max-w-md bg-white dark:bg-gray-800 rounded-3xl shadow-2xl border border-gray-200 dark:border-gray-700 overflow-hidden transform transition-all z-10">
        
        <!-- Topo com Gradiente -->
        <div class="bg-gradient-to-r from-indigo-600 via-indigo-700 to-purple-700 p-4 sm:p-5 text-white flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-xl bg-white/10 backdrop-blur-xs flex items-center justify-center shadow-inner">
                    <i data-lucide="user-cog" class="w-5 h-5 text-indigo-100"></i>
                </div>
                <div>
                    <h3 id="profile-modal-title" class="text-base sm:text-lg font-bold tracking-tight">Meu Perfil</h3>
                    <p class="text-xs text-indigo-100">Altere seu nome, usuário e senha</p>
                </div>
            </div>
            <button type="button"
                    onclick="closeProfileModal()"
                    class="p-1.5 rounded-lg text-indigo-100 hover:text-white hover:bg-white/10 active:scale-90 transition cursor-pointer"
                    title="Fechar">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Formulário de Atualização -->
        <form id="profile-modal-form" onsubmit="submitProfileModal(event)" class="p-4 sm:p-5 space-y-3.5">
            
            <!-- Banner de Alerta / Mensagem -->
            <div id="profile-modal-alert" class="hidden p-3 rounded-xl text-xs flex items-center gap-2">
                <i id="profile-modal-alert-icon" data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                <span id="profile-modal-alert-text"></span>
            </div>

            <!-- Campo: Nome Completo -->
            <div>
                <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">
                    Nome Completo <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </span>
                    <input type="text"
                           id="profile-modal-name"
                           name="name"
                           required
                           placeholder="Seu nome completo"
                           value="{{ current_user_name }}"
                           class="w-full pl-9 pr-3 py-2 text-xs sm:text-sm border border-gray-300 dark:border-gray-600 rounded-xl dark:bg-gray-750 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>
            </div>

            <!-- Campo: Nome de Usuário (Login) -->
            <div>
                <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">
                    Nome de Usuário / Login <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 font-mono text-xs">@</span>
                    <input type="text"
                           id="profile-modal-username"
                           name="username"
                           required
                           autocomplete="username"
                           placeholder="ex: joao.silva"
                           value="{{ current_user_username }}"
                           class="w-full pl-9 pr-3 py-2 text-xs sm:text-sm font-mono border border-gray-300 dark:border-gray-600 rounded-xl dark:bg-gray-750 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition lowercase">
                </div>
                <p class="text-[10px] text-gray-500 dark:text-gray-400 mt-0.5">Identificador único usado para entrar no sistema.</p>
            </div>

            <!-- Campo: Nova Senha (Opcional) -->
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300">Nova Senha</label>
                    <span class="text-[10px] text-gray-400">Opcional</span>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </span>
                    <input type="password"
                           id="profile-modal-password"
                           name="password"
                           autocomplete="new-password"
                           placeholder="Deixe em branco para não alterar"
                           class="w-full pl-9 pr-9 py-2 text-xs sm:text-sm border border-gray-300 dark:border-gray-600 rounded-xl dark:bg-gray-750 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                    <button type="button"
                            onclick="togglePasswordVisibility('profile-modal-password', this)"
                            class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 cursor-pointer"
                            title="Exibir ou ocultar senha">
                        <i data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Campo: PIN de Acesso Rápido -->
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300">Código PIN (Chão de Loja)</label>
                    <span class="text-[10px] text-gray-400">4 a 8 dígitos numéricos</span>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i data-lucide="key-round" class="w-4 h-4"></i>
                    </span>
                    <input type="password"
                           id="profile-modal-pin"
                           name="pin"
                           maxlength="8"
                           pattern="[0-9]*"
                           inputmode="numeric"
                           placeholder="Ex: 1234"
                           class="w-full pl-9 pr-9 py-2 text-xs sm:text-sm font-mono tracking-widest border border-gray-300 dark:border-gray-600 rounded-xl dark:bg-gray-750 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                    <button type="button"
                            onclick="togglePasswordVisibility('profile-modal-pin', this)"
                            class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 cursor-pointer"
                            title="Exibir ou ocultar PIN">
                        <i data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Informação de Função do Usuário -->
            <div class="p-2.5 rounded-xl bg-gray-50 dark:bg-gray-750/50 border border-gray-200/80 dark:border-gray-700 flex items-center justify-between text-xs">
                <span class="text-gray-500 dark:text-gray-400">Função no Sistema:</span>
                <span id="profile-modal-role-badge" class="px-2 py-0.5 rounded-md font-bold text-[10px] uppercase {% if is_admin %}bg-purple-100 text-purple-700 dark:bg-purple-950 dark:text-purple-300 border border-purple-200 dark:border-purple-800{% else %}bg-blue-100 text-blue-700 dark:bg-blue-950 dark:text-blue-300 border border-blue-200 dark:border-blue-800{% endif %}">
                    {{ current_user_role }}
                </span>
            </div>

            <!-- Botões de Ação -->
            <div class="flex items-center justify-end gap-2 pt-2 border-t border-gray-100 dark:border-gray-750">
                <button type="button"
                        onclick="closeProfileModal()"
                        class="px-3.5 py-2 text-xs font-semibold rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition cursor-pointer">
                    Cancelar
                </button>
                <button type="submit"
                        id="btn-profile-modal-save"
                        class="px-4 py-2 text-xs font-bold rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white transition shadow-sm flex items-center gap-1.5 cursor-pointer">
                    <i data-lucide="check" class="w-4 h-4"></i>
                    <span id="btn-profile-modal-save-text">Salvar Alterações</span>
                </button>
            </div>

        </form>

    </div>
</div>

<script>
    window.openProfileModal = function() {
        const modal = document.getElementById('profile-modal');
        if (!modal) return;

        // Limpa mensagens e campos sensíveis
        hideProfileModalAlert();
        const pwdInput = document.getElementById('profile-modal-password');
        if (pwdInput) pwdInput.value = '';

        // Busca dados mais recentes do perfil via API
        fetch('/api/user/profile')
            .then(res => res.json())
            .then(data => {
                if (data && data.success) {
                    const nameInput = document.getElementById('profile-modal-name');
                    const usernameInput = document.getElementById('profile-modal-username');
                    const pinInput = document.getElementById('profile-modal-pin');
                    const roleBadge = document.getElementById('profile-modal-role-badge');

                    if (nameInput) nameInput.value = data.name || '';
                    if (usernameInput) usernameInput.value = data.username || '';
                    if (pinInput) pinInput.value = data.pin || '';
                    if (roleBadge) roleBadge.textContent = (data.role || 'operador').toUpperCase();
                }
            })
            .catch(() => {});

        modal.classList.remove('hidden');
        if (window.lucide) window.lucide.createIcons();
    };

    window.closeProfileModal = function() {
        const modal = document.getElementById('profile-modal');
        if (modal) modal.classList.add('hidden');
    };

    window.togglePasswordVisibility = function(inputId, btn) {
        const input = document.getElementById(inputId);
        if (!input) return;
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            if (icon) icon.setAttribute('data-lucide', 'eye-off');
        } else {
            input.type = 'password';
            if (icon) icon.setAttribute('data-lucide', 'eye');
        }
        if (window.lucide) window.lucide.createIcons();
    };

    function showProfileModalAlert(msg, isSuccess = false) {
        const alertBox = document.getElementById('profile-modal-alert');
        const alertText = document.getElementById('profile-modal-alert-text');
        const alertIcon = document.getElementById('profile-modal-alert-icon');
        if (!alertBox || !alertText) return;

        alertBox.className = isSuccess
            ? 'p-3 rounded-xl text-xs flex items-center gap-2 bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300'
            : 'p-3 rounded-xl text-xs flex items-center gap-2 bg-rose-50 dark:bg-rose-950/60 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300';
        
        if (alertIcon) {
            alertIcon.setAttribute('data-lucide', isSuccess ? 'check-circle-2' : 'alert-circle');
        }
        alertText.textContent = msg;
        alertBox.classList.remove('hidden');
        if (window.lucide) window.lucide.createIcons();
    }

    function hideProfileModalAlert() {
        const alertBox = document.getElementById('profile-modal-alert');
        if (alertBox) alertBox.classList.add('hidden');
    }

    window.submitProfileModal = function(e) {
        e.preventDefault();
        const form = document.getElementById('profile-modal-form');
        const btnSave = document.getElementById('btn-profile-modal-save');
        const btnText = document.getElementById('btn-profile-modal-save-text');
        if (!form || !btnSave) return;

        const name = (document.getElementById('profile-modal-name').value || '').trim();
        const username = (document.getElementById('profile-modal-username').value || '').trim().toLowerCase();
        const password = (document.getElementById('profile-modal-password').value || '').trim();
        const pin = (document.getElementById('profile-modal-pin').value || '').trim();

        if (!name) {
            showProfileModalAlert('Por favor, informe seu nome completo.', false);
            return;
        }
        if (!username) {
            showProfileModalAlert('Por favor, informe um nome de usuário válido.', false);
            return;
        }

        btnSave.disabled = true;
        btnText.textContent = 'Salvando...';

        fetch('/api/user/profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, username, password, pin })
        })
        .then(res => res.json())
        .then(data => {
            btnSave.disabled = false;
            btnText.textContent = 'Salvar Alterações';

            if (data.success) {
                showProfileModalAlert(data.message || 'Perfil atualizado com sucesso!', true);

                // Atualiza elementos de UI imediatamente
                const newName = data.user ? data.user.name : name;
                const newUsername = data.user ? data.user.username : username;

                const desktopOp = document.getElementById('desktop-operator-name');
                if (desktopOp) desktopOp.textContent = newName;

                const mobileOp = document.getElementById('mobile-operator-name');
                if (mobileOp) mobileOp.textContent = newName;

                const drawerName = document.getElementById('drawer-user-name');
                if (drawerName) drawerName.textContent = newName;

                const drawerInitials = document.getElementById('drawer-user-initials');
                if (drawerInitials && newName.length >= 2) {
                    drawerInitials.textContent = newName.substring(0, 2).toUpperCase();
                }

                // Fecha modal após breve confirmação
                setTimeout(() => {
                    closeProfileModal();
                }, 1200);
            } else {
                showProfileModalAlert(data.error || 'Erro ao atualizar perfil.', false);
            }
        })
        .catch(err => {
            btnSave.disabled = false;
            btnText.textContent = 'Salvar Alterações';
            showProfileModalAlert('Erro de comunicação com o servidor: ' + err.message, false);
        });
    };
</script>
