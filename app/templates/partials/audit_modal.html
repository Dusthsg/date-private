<!-- Modal de Auditoria Completa -->
<div id="modal-audit" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 w-full max-w-5xl max-h-[92vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-150">
        
        <!-- Cabeçalho do Modal -->
        <div class="px-5 py-4 border-b border-gray-100 dark:border-gray-700 flex items-center justify-between bg-gray-50/70 dark:bg-gray-800/80">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-indigo-100 dark:bg-indigo-950/70 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
                    <i data-lucide="shield-alert" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 class="text-base font-bold text-gray-900 dark:text-white flex items-center gap-2">
                        <span>Registro de Auditoria Completo</span>
                        <span id="audit-badge-total" class="text-xs bg-indigo-100 text-indigo-700 dark:bg-indigo-900/60 dark:text-indigo-300 px-2 py-0.5 rounded-full font-semibold">0 eventos</span>
                    </h3>
                    <p class="text-xs text-gray-500 dark:text-gray-400">Rastreabilidade completa de todas as alterações, baixas e cadastros no estoque</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <a id="btn-export-audit-csv" href="/api/audit/export" download class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white transition shadow-xs cursor-pointer" title="Exportar histórico em planilha CSV">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">Exportar CSV</span>
                </a>
                <button type="button" onclick="closeAuditModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition cursor-pointer">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- Barra de Filtros e Busca -->
        <div class="p-3.5 border-b border-gray-100 dark:border-gray-700 bg-white dark:bg-gray-800/50">
            <form id="form-audit-filters" onsubmit="event.preventDefault(); loadAuditLogs(0);" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2.5 text-xs">
                
                <!-- Busca Textual -->
                <div>
                    <label class="block font-semibold text-gray-600 dark:text-gray-300 mb-1">Buscar Detalhe / Produto</label>
                    <div class="relative">
                        <input type="text" id="audit-filter-search" placeholder="Ex: LEITE, lote #12, admin..."
                               class="w-full pl-7 pr-2.5 py-1.5 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <i data-lucide="search" class="w-3.5 h-3.5 text-gray-400 absolute left-2 top-2"></i>
                    </div>
                </div>

                <!-- Filtro por Ação -->
                <div>
                    <label class="block font-semibold text-gray-600 dark:text-gray-300 mb-1">Tipo de Ação</label>
                    <select id="audit-filter-action" class="w-full py-1.5 px-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">Todas as Ações</option>
                        <option value="CRIAR_LOTE">Cadastrar Lote</option>
                        <option value="EDITAR_QTD">Alterar Quantidade</option>
                        <option value="EDITAR_PRECO">Alterar Preço</option>
                        <option value="BAIXA_LOTE">Baixa (Deletar Lote)</option>
                        <option value="RESTAURAR_LOTE">Restaurar Lote</option>
                        <option value="PURGAR_BAIXA">Excluir da Auditoria</option>
                        <option value="LIMPAR_AUDITORIA">Limpar Auditoria</option>
                        <option value="IMPORTACAO">Importação de Planilha</option>
                        <option value="LOGIN">Login no Sistema</option>
                        <option value="TROCA_OPERADOR">Troca de Operador</option>
                    </select>
                </div>

                <!-- Filtro por Usuário -->
                <div>
                    <label class="block font-semibold text-gray-600 dark:text-gray-300 mb-1">Usuário / Operador</label>
                    <select id="audit-filter-user" class="w-full py-1.5 px-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">Todos os Usuários</option>
                    </select>
                </div>

                <!-- Botões de Ação de Filtro -->
                <div class="flex items-end gap-1.5">
                    <button type="button" onclick="loadAuditLogs(0)"
                            class="flex-1 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold py-1.5 px-3 rounded-lg transition shadow-xs flex items-center justify-center gap-1 cursor-pointer">
                        <i data-lucide="filter" class="w-3.5 h-3.5"></i>
                        <span>Filtrar</span>
                    </button>
                    <button type="button" onclick="clearAuditFilters()"
                            class="bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 font-semibold py-1.5 px-2.5 rounded-lg transition cursor-pointer" title="Limpar Filtros">
                        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </form>
        </div>

        <!-- Tabela com Scroll -->
        <div class="flex-1 overflow-y-auto divide-y divide-gray-100 dark:divide-gray-700/60 p-1 sm:p-2">
            <table class="w-full text-left text-xs text-gray-600 dark:text-gray-300">
                <thead class="sticky top-0 bg-gray-50 dark:bg-gray-700/90 text-gray-700 dark:text-gray-200 uppercase font-semibold text-[11px] tracking-wider z-10">
                    <tr>
                        <th class="px-3 py-2 whitespace-nowrap">Data / Hora</th>
                        <th class="px-3 py-2 whitespace-nowrap">Quem Mexeu</th>
                        <th class="px-3 py-2 whitespace-nowrap">Ação</th>
                        <th class="px-3 py-2">Detalhes da Modificação</th>
                        <th class="px-3 py-2 hidden md:table-cell whitespace-nowrap">IP / Origem</th>
                    </tr>
                </thead>
                <tbody id="audit-table-body" class="divide-y divide-gray-100 dark:divide-gray-700/40">
                    <!-- Linhas carregadas dinamicamente via JS/API -->
                </tbody>
            </table>
            
            <div id="audit-empty-state" class="hidden p-8 text-center text-gray-400">
                <i data-lucide="clipboard-check" class="w-10 h-10 mx-auto mb-2 text-gray-300 dark:text-gray-600"></i>
                <p>Nenhum registro de auditoria encontrado com esses filtros.</p>
            </div>
        </div>

        <!-- Rodapé do Modal / Paginação -->
        <div class="px-4 py-3 border-t border-gray-100 dark:border-gray-700 bg-gray-50/70 dark:bg-gray-800/80 flex items-center justify-between text-xs">
            <span id="audit-page-info" class="text-gray-500 dark:text-gray-400">Página 1</span>
            <div class="flex items-center gap-1.5">
                <button type="button" id="btn-audit-prev" onclick="changeAuditPage(-1)"
                        class="px-2.5 py-1 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition disabled:opacity-40 disabled:cursor-not-allowed">
                    Anterior
                </button>
                <button type="button" id="btn-audit-next" onclick="changeAuditPage(1)"
                        class="px-2.5 py-1 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition disabled:opacity-40 disabled:cursor-not-allowed">
                    Próxima
                </button>
            </div>
        </div>

    </div>
</div>

<script>
let currentAuditPage = 0;
const auditPageLimit = 50;

function openAuditModal() {
    const modal = document.getElementById('modal-audit');
    if (!modal) return;
    modal.classList.remove('hidden');
    loadAuditUsersFilter();
    loadAuditLogs(0);
    if (window.refreshIcons) window.refreshIcons(modal);
}

function closeAuditModal() {
    const modal = document.getElementById('modal-audit');
    if (modal) modal.classList.add('hidden');
}

async function loadAuditUsersFilter() {
    try {
        const resp = await fetch('/api/users');
        if (!resp.ok) return;
        const users = await resp.json();
        const select = document.getElementById('audit-filter-user');
        if (!select) return;
        
        let html = '<option value="">Todos os Usuários</option>';
        users.forEach(u => {
            html += `<option value="${u.username}">${u.name} (@${u.username})</option>`;
        });
        select.innerHTML = html;
    } catch (e) {
        console.error("Erro ao carregar usuários para filtro:", e);
    }
}

async function loadAuditLogs(page = 0) {
    currentAuditPage = Math.max(0, page);
    const search = document.getElementById('audit-filter-search')?.value || '';
    const action = document.getElementById('audit-filter-action')?.value || '';
    const user = document.getElementById('audit-filter-user')?.value || '';
    const offset = currentAuditPage * auditPageLimit;

    // Atualiza link de exportação com os filtros aplicados
    const exportBtn = document.getElementById('btn-export-audit-csv');
    if (exportBtn) {
        exportBtn.href = `/api/audit/export?search=${encodeURIComponent(search)}&action=${encodeURIComponent(action)}&user=${encodeURIComponent(user)}`;
    }

    try {
        const url = `/api/audit/logs?limit=${auditPageLimit}&offset=${offset}&search=${encodeURIComponent(search)}&action=${encodeURIComponent(action)}&user=${encodeURIComponent(user)}`;
        const resp = await fetch(url);
        if (!resp.ok) throw new Error("Falha na consulta de auditoria");
        const data = await resp.json();

        renderAuditRows(data.logs, data.total);
    } catch (e) {
        console.error("Erro ao buscar logs de auditoria:", e);
    }
}

function clearAuditFilters() {
    document.getElementById('audit-filter-search').value = '';
    document.getElementById('audit-filter-action').value = '';
    document.getElementById('audit-filter-user').value = '';
    loadAuditLogs(0);
}

function changeAuditPage(delta) {
    loadAuditLogs(currentAuditPage + delta);
}

function renderAuditRows(logs, total) {
    const tbody = document.getElementById('audit-table-body');
    const emptyState = document.getElementById('audit-empty-state');
    const badgeTotal = document.getElementById('audit-badge-total');
    const pageInfo = document.getElementById('audit-page-info');
    const btnPrev = document.getElementById('btn-audit-prev');
    const btnNext = document.getElementById('btn-audit-next');

    if (badgeTotal) badgeTotal.innerText = `${total} evento(s)`;

    if (!logs || logs.length === 0) {
        if (tbody) tbody.innerHTML = '';
        if (emptyState) emptyState.classList.remove('hidden');
        if (btnPrev) btnPrev.disabled = true;
        if (btnNext) btnNext.disabled = true;
        if (pageInfo) pageInfo.innerText = 'Página 1 de 1';
        return;
    }

    if (emptyState) emptyState.classList.add('hidden');

    const totalPages = Math.ceil(total / auditPageLimit) || 1;
    if (pageInfo) pageInfo.innerText = `Página ${currentAuditPage + 1} de ${totalPages}`;
    if (btnPrev) btnPrev.disabled = currentAuditPage <= 0;
    if (btnNext) btnNext.disabled = (currentAuditPage + 1) >= totalPages;

    let html = '';
    logs.forEach(l => {
        let badgeColor = 'bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-300';
        let actionIcon = 'activity';

        switch(l.action) {
            case 'CRIAR_LOTE':
                badgeColor = 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800';
                actionIcon = 'plus-circle';
                break;
            case 'EDITAR_QTD':
            case 'EDITAR_PRECO':
                badgeColor = 'bg-blue-100 text-blue-800 dark:bg-blue-950/80 dark:text-blue-300 border border-blue-200 dark:border-blue-800';
                actionIcon = 'pencil';
                break;
            case 'BAIXA_LOTE':
            case 'PURGAR_BAIXA':
            case 'LIMPAR_AUDITORIA':
                badgeColor = 'bg-rose-100 text-rose-800 dark:bg-rose-950/80 dark:text-rose-300 border border-rose-200 dark:border-rose-800';
                actionIcon = 'trash-2';
                break;
            case 'RESTAURAR_LOTE':
                badgeColor = 'bg-teal-100 text-teal-800 dark:bg-teal-950/80 dark:text-teal-300 border border-teal-200 dark:border-teal-800';
                actionIcon = 'rotate-ccw';
                break;
            case 'IMPORTACAO':
                badgeColor = 'bg-purple-100 text-purple-800 dark:bg-purple-950/80 dark:text-purple-300 border border-purple-200 dark:border-purple-800';
                actionIcon = 'file-spreadsheet';
                break;
            case 'LOGIN':
            case 'TROCA_OPERADOR':
                badgeColor = 'bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300 border border-amber-200 dark:border-amber-800';
                actionIcon = 'user-check';
                break;
            case 'CRIAR_USUARIO':
            case 'EDITAR_USUARIO':
            case 'EXCLUIR_USUARIO':
                badgeColor = 'bg-indigo-100 text-indigo-800 dark:bg-indigo-950/80 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800';
                actionIcon = 'users';
                break;
        }

        html += `
            <tr class="hover:bg-gray-50/80 dark:hover:bg-gray-700/40 transition">
                <td class="px-3 py-2.5 font-mono text-[11px] text-gray-500 dark:text-gray-400 whitespace-nowrap">
                    ${l.created_at}
                </td>
                <td class="px-3 py-2.5 font-semibold text-gray-800 dark:text-gray-100 whitespace-nowrap">
                    <span class="inline-flex items-center gap-1.5">
                        <i data-lucide="user" class="w-3.5 h-3.5 text-gray-400"></i>
                        <span>${l.username}</span>
                    </span>
                </td>
                <td class="px-3 py-2.5 whitespace-nowrap">
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold ${badgeColor}">
                        <i data-lucide="${actionIcon}" class="w-3 h-3"></i>
                        <span>${l.action}</span>
                    </span>
                </td>
                <td class="px-3 py-2.5 text-gray-700 dark:text-gray-200 font-medium break-words">
                    ${l.details}
                </td>
                <td class="px-3 py-2.5 hidden md:table-cell font-mono text-[10px] text-gray-400 whitespace-nowrap">
                    ${l.ip_address || '-'}
                </td>
            </tr>
        `;
    });

    if (tbody) tbody.innerHTML = html;
    if (window.refreshIcons) window.refreshIcons(tbody);
}
</script>
