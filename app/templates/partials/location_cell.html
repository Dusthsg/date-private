<td class="td-location px-3 py-2.5 whitespace-nowrap text-xs" id="location-cell-{{ lot['lot_id'] }}">
    <span class="card-label text-[11px] text-gray-400 dark:text-gray-500 mr-1 font-semibold">Local:</span>
    <div class="relative inline-block text-left" id="loc-dropdown-{{ lot['lot_id'] }}">
        {% if lot.get('is_deleted') %}
            <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold
                {% if lot['location'] in ('GALPÃO', 'GALPAO') %}
                    bg-indigo-50 text-indigo-700 dark:bg-indigo-950/50 dark:text-indigo-300 border border-indigo-200/60 dark:border-indigo-800/60
                {% elif lot['location'] == 'LOJA' %}
                    bg-sky-50 text-sky-700 dark:bg-sky-950/50 dark:text-sky-300 border border-sky-200/60 dark:border-sky-800/60
                {% else %}
                    bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300 border border-slate-200 dark:border-slate-700
                {% endif %}"
                title="Localização do lote">
                <i data-lucide="map-pin" class="w-3 h-3"></i>
                <span>{{ lot['location'] }}</span>
            </span>
        {% else %}
            <button type="button"
                    onclick="window.toggleLotDropdown('menu-loc-{{ lot['lot_id'] }}', event)"
                    class="lot-dropdown-trigger inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold sm:font-semibold border transition cursor-pointer select-none active:scale-95 shadow-2xs hover:shadow-xs
                    {% if lot['location'] in ('GALPÃO', 'GALPAO') %}
                        bg-indigo-100 text-indigo-800 dark:bg-indigo-950/70 dark:text-indigo-300 border-indigo-200 dark:border-indigo-800 hover:bg-indigo-200 dark:hover:bg-indigo-900/60
                    {% elif lot['location'] == 'LOJA' %}
                        bg-sky-100 text-sky-800 dark:bg-sky-950/70 dark:text-sky-300 border-sky-200 dark:border-sky-800 hover:bg-sky-200 dark:hover:bg-sky-900/60
                    {% else %}
                        bg-slate-100 text-slate-800 dark:bg-slate-800 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700
                    {% endif %}"
                    title="Alterar localidade (Menu rápido)">
                <i data-lucide="map-pin" class="w-3 h-3 text-sky-600 dark:text-sky-400"></i>
                <span>{{ lot['location'] }}</span>
                <i data-lucide="chevron-down" class="w-2.5 h-2.5 opacity-60"></i>
            </button>
            <div id="menu-loc-{{ lot['lot_id'] }}"
                 class="lot-floating-menu hidden absolute left-0 mt-1 min-w-[130px] bg-white dark:bg-gray-800 rounded-xl shadow-xl border border-gray-200 dark:border-gray-700 py-1 z-50 animate-in fade-in zoom-in-95 duration-100">
                <div class="px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500 border-b border-gray-100 dark:border-gray-700/60">
                    Localidade
                </div>
                {% for loc_opt in (available_locations or [{'name': 'LOJA'}, {'name': 'GALPÃO'}]) %}
                <button type="button"
                        hx-post="/lote/{{ lot['lot_id'] }}/localizacao"
                        hx-vals='{"location": "{{ loc_opt.name }}"}'
                        hx-target="#location-cell-{{ lot['lot_id'] }}"
                        hx-swap="outerHTML"
                        onclick="window.closeAllLotDropdowns()"
                        class="w-full text-left px-3 py-1.5 text-xs font-medium flex items-center justify-between hover:bg-sky-50 dark:hover:bg-sky-950/40 text-gray-700 dark:text-gray-200 hover:text-sky-600 dark:hover:text-sky-400 transition cursor-pointer">
                    <span class="flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full {% if loc_opt.name in ('GALPÃO', 'GALPAO') %}bg-indigo-500{% else %}bg-sky-500{% endif %}"></span> {{ loc_opt.name }}
                    </span>
                    {% if lot['location'] == loc_opt.name %}<i data-lucide="check" class="w-3.5 h-3.5 text-sky-600 dark:text-sky-400"></i>{% endif %}
                </button>
                {% endfor %}
            </div>
        {% endif %}
    </div>
</td>
