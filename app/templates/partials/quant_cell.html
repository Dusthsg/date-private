<td class="px-3 py-2.5 text-gray-600 dark:text-gray-300 whitespace-nowrap" id="quant-cell-{{ lot['lot_id'] }}">
    <!-- Visualização normal -->
    <div id="view-quant-{{ lot['lot_id'] }}" class="flex items-center gap-1.5 whitespace-nowrap">
        <span class="font-medium text-gray-800 dark:text-gray-100">{{ lot['quant'] }}</span>
        <button type="button"
                onclick="startEditing({{ lot['lot_id'] }})"
                class="text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition p-1 rounded hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer"
                title="Editar quantidade">
            <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
        </button>
    </div>

    <!-- Formulário inline instantâneo (sem requisição prévia de HTML) -->
    <form id="edit-quant-{{ lot['lot_id'] }}"
          hx-post="/lote/{{ lot['lot_id'] }}/quantidade"
          hx-target="#quant-cell-{{ lot['lot_id'] }}"
          hx-swap="outerHTML"
          onsubmit="window.isEditingLot = false;"
          class="flex items-center gap-1"
          style="display: none;">
        <input type="number" id="input-quant-{{ lot['lot_id'] }}" name="quant" value="{{ lot['quant'] }}" min="0" required
               class="w-16 border border-indigo-400 dark:border-indigo-500 rounded px-1.5 py-0.5 text-xs text-gray-800 dark:text-white dark:bg-gray-700 focus:outline-none focus:ring-1 focus:ring-indigo-500">
        <button type="submit"
                class="bg-green-600 hover:bg-green-700 text-white rounded px-2 py-0.5 text-xs font-bold transition shadow-sm cursor-pointer"
                title="Salvar">
            <i data-lucide="check" class="w-3.5 h-3.5"></i>
        </button>
        <button type="button"
                onclick="stopEditing({{ lot['lot_id'] }})"
                class="bg-gray-200 hover:bg-gray-300 dark:bg-gray-600 dark:hover:bg-gray-500 text-gray-600 dark:text-gray-200 rounded px-1.5 py-0.5 text-xs transition cursor-pointer"
                title="Cancelar">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
    </form>
</td>
