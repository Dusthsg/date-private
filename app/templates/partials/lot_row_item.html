<tr class="border-b border-gray-100 hover:bg-indigo-50 transition odd:bg-white even:bg-gray-50/60"
    id="lot-{{ lot['lot_id'] }}">

    <td class="px-3 py-2.5 font-mono text-gray-500 whitespace-nowrap">#{{ lot['lot_id'] }}</td>

    <td class="px-3 py-2.5 font-medium text-gray-800 min-w-[280px] max-w-[55ch] truncate"
        title="{{ lot['product_name'] }}">
        {{ lot['product_name'] }}
    </td>

    {% include "partials/quant_cell.html" %}

    {% include "partials/price_cell.html" %}

    <td class="px-3 py-2.5 whitespace-nowrap">
        <span class="inline-block px-2 py-0.5 rounded-full text-xs font-semibold
            {% if lot['date_valid'] < now_date %}
                bg-red-100 text-red-700
            {% elif lot['date_valid'] <= critico_date %}
                bg-orange-100 text-orange-700
            {% elif lot['date_valid'] <= atencao_date %}
                bg-yellow-100 text-yellow-700
            {% else %}
                bg-green-100 text-green-700
            {% endif %}">
            {{ lot['date_valid'][8:] }}/{{ lot['date_valid'][5:7] }}/{{ lot['date_valid'][:4] }}
        </span>
    </td>

    <td class="px-3 py-2.5 hidden md:table-cell text-gray-500 whitespace-nowrap">{{ lot['location'] }}</td>
    <td class="px-3 py-2.5 hidden md:table-cell text-gray-500 whitespace-nowrap">{{ lot['status'] }}</td>

    <td class="px-3 py-2.5 text-center whitespace-nowrap">
        <button hx-delete="/lote/{{ lot['lot_id'] }}"
                hx-target="#lot-{{ lot['lot_id'] }}"
                hx-swap="outerHTML swap:0.4s"
                hx-confirm="Tem certeza que deseja dar baixa no lote #{{ lot['lot_id'] }} — {{ lot['product_name'] }}?"
                class="inline-flex items-center gap-1 bg-red-500 hover:bg-red-600 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition shadow-sm active:scale-95"
                title="Dar baixa (deletar lote)">
            ✕ <span class="hidden sm:inline">Baixa</span>
        </button>
    </td>
</tr>
