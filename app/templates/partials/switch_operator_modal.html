<!-- Modal de Troca Rápida de Operador no Chão de Loja -->
<div id="modal-switch-operator" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 w-full max-w-sm overflow-hidden animate-in fade-in zoom-in-95 duration-150">
        
        <div class="px-5 py-4 border-b border-gray-100 dark:border-gray-700 flex items-center justify-between bg-emerald-50/60 dark:bg-emerald-950/40">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-xl bg-emerald-100 dark:bg-emerald-900/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center">
                    <i data-lucide="user-check" class="w-4 h-4"></i>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-gray-900 dark:text-white">Trocar Operador</h3>
                    <p class="text-[11px] text-gray-500 dark:text-gray-400">Identificação rápida no chão de loja</p>
                </div>
            </div>
            <button type="button" onclick="closeSwitchOperatorModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition cursor-pointer">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <form id="form-switch-operator" onsubmit="submitSwitchOperator(event)" class="p-5 space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Digite seu PIN de 4 dígitos</label>
                <div class="relative">
                    <input type="password" id="input-switch-pin" maxlength="8" pattern="[0-9]*" inputmode="numeric" required autofocus
                           placeholder="••••"
                           class="w-full text-center tracking-widest font-mono text-2xl py-2.5 px-3 border border-gray-300 dark:border-gray-600 rounded-xl dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <div id="switch-operator-msg" class="text-xs text-center font-semibold min-h-[1.25rem]"></div>

            <div class="flex items-center gap-2 pt-1">
                <button type="button" onclick="closeSwitchOperatorModal()"
                        class="flex-1 py-2 rounded-xl border border-gray-300 dark:border-gray-600 text-xs font-semibold hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                    Cancelar
                </button>
                <button type="submit"
                        class="flex-1 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white text-xs font-semibold shadow-xs transition">
                    Confirmar PIN
                </button>
            </div>
        </form>

    </div>
</div>

<script>
function openSwitchOperatorModal() {
    const modal = document.getElementById('modal-switch-operator');
    if (!modal) return;
    modal.classList.remove('hidden');
    const input = document.getElementById('input-switch-pin');
    if (input) {
        input.value = '';
        input.focus();
    }
    const msg = document.getElementById('switch-operator-msg');
    if (msg) msg.innerHTML = '';
    if (window.refreshIcons) window.refreshIcons(modal);
}

function closeSwitchOperatorModal() {
    const modal = document.getElementById('modal-switch-operator');
    if (modal) modal.classList.add('hidden');
}

async function submitSwitchOperator(evt) {
    evt.preventDefault();
    const pin = document.getElementById('input-switch-pin')?.value;
    const msg = document.getElementById('switch-operator-msg');

    if (!pin) return;

    try {
        const resp = await fetch('/api/operator/switch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin: pin })
        });
        const res = await resp.json();
        if (!resp.ok || !res.success) throw new Error(res.error || "PIN incorreto");

        msg.innerHTML = `<span class="text-emerald-600 font-bold">✓ Operador ativo: ${res.active_operator}</span>`;
        setTimeout(() => {
            window.location.reload();
        }, 600);
    } catch (e) {
        msg.innerHTML = `<span class="text-rose-600 font-bold">✕ ${e.message}</span>`;
    }
}
</script>
