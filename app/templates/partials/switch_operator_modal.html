<!-- Modal de Troca Rápida de Operador no Chão de Loja -->
<div id="modal-switch-operator"
     onclick="if(event.target === this) closeSwitchOperatorModal()"
     class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-xs items-center justify-center p-3 sm:p-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 w-full max-w-sm overflow-hidden animate-in fade-in zoom-in-95 duration-150">
        
        <div class="px-5 py-4 border-b border-gray-100 dark:border-gray-700 flex items-center justify-between bg-emerald-50/60 dark:bg-emerald-950/40">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-xl bg-emerald-100 dark:bg-emerald-900/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center">
                    <i data-lucide="user-check" class="w-4 h-4"></i>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-gray-900 dark:text-white">Trocar Operador</h3>
                    <p class="text-[11px] text-gray-500 dark:text-gray-400">Identificação rápida no chão de loja</p>
                </div>
            </div>
            <button type="button" onclick="closeSwitchOperatorModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition cursor-pointer">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <form id="form-switch-operator" onsubmit="submitSwitchOperator(event)" class="p-5 space-y-3">
            <div>
                <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Digite seu PIN de 4 dígitos</label>
                <div class="relative">
                    <input type="password" id="input-switch-pin" maxlength="8" pattern="[0-9]*" inputmode="numeric" required autofocus autocomplete="off"
                           placeholder="••••"
                           class="w-full text-center tracking-widest font-mono text-2xl py-2 px-3 border border-gray-300 dark:border-gray-600 rounded-xl dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <!-- Teclado Touch Integrado -->
            <div class="grid grid-cols-3 gap-1.5 pt-1">
                {% for n in ['1','2','3','4','5','6','7','8','9'] %}
                <button type="button" onclick="appendSwitchPin('{{ n }}')"
                        class="py-2.5 rounded-xl bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 active:scale-95 text-base font-bold text-gray-800 dark:text-white transition cursor-pointer select-none">
                    {{ n }}
                </button>
                {% endfor %}
                <button type="button" onclick="clearSwitchPin()"
                        class="py-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/60 hover:bg-rose-100 text-rose-600 dark:text-rose-400 active:scale-95 text-xs font-bold transition cursor-pointer select-none">
                    LIMPAR
                </button>
                <button type="button" onclick="appendSwitchPin('0')"
                        class="py-2.5 rounded-xl bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 active:scale-95 text-base font-bold text-gray-800 dark:text-white transition cursor-pointer select-none">
                    0
                </button>
                <button type="button" onclick="backspaceSwitchPin()"
                        class="py-2.5 rounded-xl bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 active:scale-95 text-base font-bold text-gray-700 dark:text-gray-200 transition cursor-pointer select-none">
                    ⌫
                </button>
            </div>

            <div id="switch-operator-msg" class="text-xs text-center font-semibold min-h-[1.25rem]"></div>

            <div class="flex items-center gap-2 pt-1">
                <button type="button" onclick="closeSwitchOperatorModal()"
                        class="flex-1 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 text-xs font-semibold hover:bg-gray-100 dark:hover:bg-gray-700 transition cursor-pointer">
                    Cancelar
                </button>
                <button type="submit"
                        class="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white text-xs font-bold shadow-xs transition cursor-pointer">
                    Confirmar PIN
                </button>
            </div>
        </form>

    </div>
</div>

<script>
function appendSwitchPin(num) {
    const inp = document.getElementById('input-switch-pin');
    if (inp && inp.value.length < 8) {
        inp.value += num;
    }
}

function clearSwitchPin() {
    const inp = document.getElementById('input-switch-pin');
    if (inp) {
        inp.value = '';
        inp.focus();
    }
}

function backspaceSwitchPin() {
    const inp = document.getElementById('input-switch-pin');
    if (inp && inp.value.length > 0) {
        inp.value = inp.value.slice(0, -1);
    }
}

function openSwitchOperatorModal() {
    const modal = document.getElementById('modal-switch-operator');
    if (!modal) return;
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    const input = document.getElementById('input-switch-pin');
    if (input) {
        input.value = '';
        setTimeout(() => input.focus(), 60);
    }
    const msg = document.getElementById('switch-operator-msg');
    if (msg) msg.innerHTML = '';
    if (window.refreshIcons) {
        window.refreshIcons(modal);
    } else if (window.lucide) {
        window.lucide.createIcons();
    }
}

function closeSwitchOperatorModal() {
    const modal = document.getElementById('modal-switch-operator');
    if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        const modal = document.getElementById('modal-switch-operator');
        if (modal && !modal.classList.contains('hidden')) {
            closeSwitchOperatorModal();
        }
    }
});

async function submitSwitchOperator(evt) {
    if (evt && evt.preventDefault) evt.preventDefault();
    const input = document.getElementById('input-switch-pin');
    const pin = (input?.value || '').trim();
    const msg = document.getElementById('switch-operator-msg');

    if (!pin) {
        if (msg) msg.innerHTML = '<span class="text-amber-600 font-semibold">Digite seu PIN.</span>';
        if (input) input.focus();
        return;
    }

    if (msg) msg.innerHTML = '<span class="text-indigo-600 dark:text-indigo-400 font-semibold animate-pulse">Verificando...</span>';

    try {
        const resp = await fetch('/api/operator/switch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin: pin })
        });
        const res = await resp.json();
        if (!resp.ok || !res.success) {
            throw new Error(res.error || "PIN incorreto ou operador inativo.");
        }

        // Fecha o modal imediatamente
        closeSwitchOperatorModal();

        // Atualiza a interface instantaneamente sem recarregar a página (0ms reload)
        if (typeof window.updateActiveOperatorUI === 'function') {
            window.updateActiveOperatorUI(res);
        }
    } catch (e) {
        if (msg) {
            msg.innerHTML = `<span class="text-rose-600 dark:text-rose-400 font-bold">✕ ${e.message}</span>`;
        }
        if (input) {
            input.value = '';
            input.focus();
        }
    }
}
</script>
