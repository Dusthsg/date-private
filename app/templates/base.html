<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateLimit — Controle de Validade</title>

    <!-- TailwindCSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- HTMX via CDN -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <style>
        /* Animação de fade-out ao deletar */
        tr.htmx-swapping { opacity: 0; transition: opacity 0.4s ease-out; }
    </style>
    <script>
        // Flag global de edição
        window.isEditingLot = false;

        function startEditing(lotId) {
            window.isEditingLot = true;
            document.getElementById('view-quant-' + lotId).classList.add('hidden');
            const editForm = document.getElementById('edit-quant-' + lotId);
            editForm.classList.remove('hidden');
            const input = document.getElementById('input-quant-' + lotId);
            if (input) input.focus();
        }

        function stopEditing(lotId) {
            window.isEditingLot = false;
            const editForm = document.getElementById('edit-quant-' + lotId);
            if (editForm) editForm.classList.add('hidden');
            const viewDiv = document.getElementById('view-quant-' + lotId);
            if (viewDiv) viewDiv.classList.remove('hidden');
        }

        function startEditingPrice(lotId) {
            window.isEditingLot = true;
            document.getElementById('view-price-' + lotId).classList.add('hidden');
            const editForm = document.getElementById('edit-price-' + lotId);
            editForm.classList.remove('hidden');
            const input = document.getElementById('input-price-' + lotId);
            if (input) input.focus();
        }

        function stopEditingPrice(lotId) {
            window.isEditingLot = false;
            const editForm = document.getElementById('edit-price-' + lotId);
            if (editForm) editForm.classList.add('hidden');
            const viewDiv = document.getElementById('view-price-' + lotId);
            if (viewDiv) viewDiv.classList.remove('hidden');
        }

        // Bloqueia qualquer requisição de polling (every 5s) se o usuário estiver editando ou com foco em input
        document.addEventListener("htmx:confirm", function(evt) {
            // Se a requisição veio do polling da tabela
            if (evt.target && evt.target.id === "lot-table-body") {
                if (window.isEditingLot) {
                    evt.preventDefault();
                    return;
                }
                const openEditForms = document.querySelectorAll("form[id^='edit-quant-']:not(.hidden), form[id^='edit-price-']:not(.hidden)");
                if (openEditForms && openEditForms.length > 0) {
                    window.isEditingLot = true;
                    evt.preventDefault();
                    return;
                }
                const active = document.activeElement;
                if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")) {
                    evt.preventDefault();
                    return;
                }
            }
        });
    </script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight">📦 DateLimit</h1>
                <span class="text-indigo-200 text-xs hidden sm:inline">Controle de Validade</span>
            </div>
            <!-- Links de Acesso -->
            <div class="flex flex-wrap items-center gap-2 text-xs">
                <a href="{{ local_url }}" target="_blank"
                   class="bg-indigo-800 hover:bg-indigo-900 px-2.5 py-1 rounded-md text-indigo-100 flex items-center gap-1 transition">
                    💻 <span>Local:</span> <span class="font-mono text-white">{{ local_url }}</span>
                </a>
                <a href="{{ network_url }}" target="_blank"
                   class="bg-emerald-600 hover:bg-emerald-700 px-2.5 py-1 rounded-md text-white font-medium flex items-center gap-1 transition shadow-sm"
                   title="Use este link no navegador do celular conectado no mesmo Wi-Fi">
                    📱 <span>Rede/Celular:</span> <span class="font-mono font-bold">{{ network_url }}</span>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-2 sm:px-4 py-4 sm:py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center text-gray-400 text-xs py-4">
        DateLimit — Interface temporária (Flask + HTMX)
    </footer>

</body>
</html>
