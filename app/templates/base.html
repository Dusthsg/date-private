<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateLimit — Controle de Validade</title>

    <!-- TailwindCSS via CDN com suporte a darkMode: 'class' -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        };
    </script>

    <!-- Detecção Instantânea de Tema Salvo (Evita tela branca ao carregar) -->
    <script>
        (function() {
            try {
                const saved = localStorage.getItem('datelimit_theme');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (saved === 'dark' || (!saved && prefersDark)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>

    <!-- HTMX via CDN -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <!-- Lucide Icons via CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Animação de fade-out ao deletar */
        tr.htmx-swapping { opacity: 0; transform: scaleY(0.7); transition: all 0.15s ease-out; }

        /* Ajuste do esquema de cores nativo (scrollbars e controles do navegador) */
        html.dark {
            color-scheme: dark;
        }
        html:not(.dark) {
            color-scheme: light;
        }
        /* Oculta scrollbars nativas mas mantém rolagem e arraste por toque e mouse */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <script>
                // Suporte a Lucide Icons com re-renderização de alta performance com escopo e requestAnimationFrame
        let _iconRafPending = false;
        window.refreshIcons = function(rootEl) {
            if (!window.lucide || typeof window.lucide.createIcons !== 'function') return;
            try {
                if (rootEl && rootEl.nodeType === Node.ELEMENT_NODE) {
                    window.lucide.createIcons({ root: rootEl });
                } else {
                    if (_iconRafPending) return;
                    _iconRafPending = true;
                    requestAnimationFrame(() => {
                        _iconRafPending = false;
                        try {
                            window.lucide.createIcons();
                        } catch (e) {}
                    });
                }
            } catch (e) {
                console.error("Erro ao renderizar Lucide icons:", e);
            }
        };

        document.addEventListener('DOMContentLoaded', () => window.refreshIcons());
        document.addEventListener('htmx:afterSwap', (evt) => {
            const target = evt.detail && evt.detail.target;
            window.refreshIcons(target || document.body);
        });
        document.addEventListener('htmx:afterSettle', (evt) => {
            const target = evt.detail && evt.detail.target;
            window.refreshIcons(target || document.body);
        });
        document.addEventListener('htmx:load', (evt) => {
            const elt = evt.detail && evt.detail.elt;
            window.refreshIcons(elt || document.body);
        });

        // Flag global de edição
        window.isEditingLot = false;

        function startEditing(lotId) {
            window.isEditingLot = true;
            const viewDiv = document.getElementById('view-quant-' + lotId);
            if (viewDiv) viewDiv.style.display = 'none';
            const editForm = document.getElementById('edit-quant-' + lotId);
            if (editForm) {
                editForm.style.display = 'flex';
                const input = document.getElementById('input-quant-' + lotId);
                if (input) {
                    input.focus();
                    input.select();
                }
            }
            window.refreshIcons();
        }

        function stopEditing(lotId) {
            window.isEditingLot = false;
            const editForm = document.getElementById('edit-quant-' + lotId);
            if (editForm) editForm.style.display = 'none';
            const viewDiv = document.getElementById('view-quant-' + lotId);
            if (viewDiv) viewDiv.style.display = 'flex';
            window.refreshIcons();
        }

        function startEditingPrice(lotId) {
            window.isEditingLot = true;
            const viewDiv = document.getElementById('view-price-' + lotId);
            if (viewDiv) viewDiv.style.display = 'none';
            const editForm = document.getElementById('edit-price-' + lotId);
            if (editForm) {
                editForm.style.display = 'flex';
                const input = document.getElementById('input-price-' + lotId);
                if (input) {
                    input.focus();
                    input.select();
                }
            }
            window.refreshIcons();
        }

        function stopEditingPrice(lotId) {
            window.isEditingLot = false;
            const editForm = document.getElementById('edit-price-' + lotId);
            if (editForm) editForm.style.display = 'none';
            const viewDiv = document.getElementById('view-price-' + lotId);
            if (viewDiv) viewDiv.style.display = 'flex';
            window.refreshIcons();
        }

        // Bloqueia qualquer requisição de polling (every 5s) se o usuário estiver editando ou com foco em input
        document.addEventListener("htmx:confirm", function(evt) {
            // Se a requisição veio do polling da tabela
            if (evt.target && evt.target.id === "lot-table-body") {
                if (window.isEditingLot) {
                    evt.preventDefault();
                    return;
                }
                const openEditForms = Array.from(document.querySelectorAll("form[id^='edit-quant-'], form[id^='edit-price-']"))
                    .filter(f => f.style.display === 'flex' || (!f.classList.contains('hidden') && f.style.display !== 'none'));
                if (openEditForms && openEditForms.length > 0) {
                    window.isEditingLot = true;
                    evt.preventDefault();
                    return;
                }
                const active = document.activeElement;
                if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")) {
                    evt.preventDefault();
                    return;
                }
            }
        });

        // Alternância e persistência de Modo Escuro
        window.updateThemeUI = function() {
            const isDark = document.documentElement.classList.contains('dark');
            if (document.body) {
                if (isDark) document.body.classList.add('dark');
                else document.body.classList.remove('dark');
            }
            const icon = document.getElementById('theme-toggle-icon');
            const text = document.getElementById('theme-toggle-text');
            const btn = document.getElementById('btn-theme-toggle');
            if (icon) { icon.innerHTML = `<i data-lucide="${isDark ? 'sun' : 'moon'}" class="w-3.5 h-3.5 inline-block text-amber-300"></i>`; window.refreshIcons(icon); }
            if (text) text.innerText = isDark ? 'Modo Claro' : 'Modo Escuro';
            if (btn) btn.title = isDark ? 'Mudar para Modo Claro' : 'Mudar para Modo Escuro';
        };

        window.toggleDarkMode = function() {
            const isDark = document.documentElement.classList.toggle('dark');
            if (document.body) {
                if (isDark) document.body.classList.add('dark');
                else document.body.classList.remove('dark');
            }
            try {
                localStorage.setItem('datelimit_theme', isDark ? 'dark' : 'light');
            } catch (e) {}
            window.updateThemeUI();
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', window.updateThemeUI);
        } else {
            window.updateThemeUI();
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">

    <!-- Header -->
    <header class="bg-indigo-700 dark:bg-gray-800 text-white shadow-lg border-b border-indigo-800 dark:border-gray-700 transition-colors duration-200">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight inline-flex items-center gap-2"><i data-lucide="package" class="w-6 h-6 text-indigo-300 dark:text-indigo-400"></i><span>DateLimit</span></h1>
                    <span class="text-indigo-200 dark:text-indigo-300 text-xs hidden sm:inline">Controle de Validade</span>
                </div>
            </div>

            <!-- Links de Acesso + Botão de Modo Escuro -->
            <div class="flex flex-wrap items-center gap-2 text-xs">
                <!-- Botão de Alertas Automáticos -->
                <button id="btn-alerts-modal"
                        type="button"
                        onclick="openAlertsModal()"
                        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 hover:bg-amber-600 active:scale-95 text-white transition border border-amber-400/80 shadow-xs cursor-pointer select-none"
                        title="Configurar Alertas Automáticos (Telegram / Webhook)">
                    <i data-lucide="bell" class="w-3.5 h-3.5"></i>
                    <span>Alertas</span>
                </button>

                <!-- Botão de Alternar Modo Escuro -->
                <button id="btn-theme-toggle"
                        type="button"
                        onclick="toggleDarkMode()"
                        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-800/90 hover:bg-indigo-900 dark:bg-gray-700 dark:hover:bg-gray-600 text-indigo-100 dark:text-amber-300 transition border border-indigo-600/70 dark:border-gray-600 shadow-xs cursor-pointer select-none active:scale-95"
                        title="Alternar entre modo claro e escuro">
                    <span id="theme-toggle-icon"><i data-lucide="moon" class="w-3.5 h-3.5 inline-block text-amber-300"></i></span>
                    <span id="theme-toggle-text">Modo Escuro</span>
                </button>

                <a href="{{ local_url }}" target="_blank"
                   class="bg-indigo-800 hover:bg-indigo-900 dark:bg-gray-700 dark:hover:bg-gray-600 px-2.5 py-1.5 rounded-lg text-indigo-100 dark:text-gray-200 flex items-center gap-1 transition border border-indigo-600/40 dark:border-gray-600">
                    <i data-lucide="laptop" class="w-3.5 h-3.5"></i> <span>Local:</span> <span class="font-mono text-white dark:text-indigo-200">{{ local_url }}</span>
                </a>
                <a href="{{ network_url }}" target="_blank"
                   class="bg-emerald-600 hover:bg-emerald-700 dark:bg-emerald-700 dark:hover:bg-emerald-600 px-2.5 py-1.5 rounded-lg text-white font-medium flex items-center gap-1 transition shadow-sm"
                   title="Use este link no navegador do celular conectado no mesmo Wi-Fi">
                    <i data-lucide="smartphone" class="w-3.5 h-3.5"></i> <span>Rede/Celular:</span> <span class="font-mono font-bold">{{ network_url }}</span>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-2 sm:px-4 py-4 sm:py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="mt-8 border-t border-gray-200 dark:border-gray-800 bg-white/60 dark:bg-gray-800/60 backdrop-blur-xs py-5 text-center text-xs text-gray-500 dark:text-gray-400 transition-colors">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2.5">
            <div class="flex items-center gap-2 font-medium text-gray-600 dark:text-gray-300">
                <i data-lucide="shield-check" class="w-4 h-4 text-indigo-500 dark:text-indigo-400"></i>
                <span>DateLimit &mdash; Controle Inteligente de Validade</span>
            </div>
            <div class="flex items-center gap-1.5 text-xs text-gray-500 dark:text-gray-400">
                <span>&copy; <span id="footer-year">2026</span> <strong class="font-semibold text-gray-700 dark:text-gray-200 tracking-wide">Reality</strong>. Todos os direitos reservados.</span>
            </div>
        </div>
    </footer>
    <script>
        (function() {
            const fy = document.getElementById('footer-year');
            if (fy) fy.textContent = new Date().getFullYear();
        })();
    </script>

    <!-- Modal de Configuração de Alertas Automáticos -->
    {% include "partials/alerts_modal.html" %}

</body>
</html>
